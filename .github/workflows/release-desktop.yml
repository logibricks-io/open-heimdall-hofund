# Builds the menu-bar bundles. A version tag publishes them onto the GitHub
# release created by the CLI workflow. workflow_dispatch only uploads workflow
# artifacts. Empty signing secrets skip that step.

name: Release desktop

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: dmg,app
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis,msi
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Build bundles and checksums
        uses: ./.github/actions/desktop-bundle
        with:
          bundles: ${{ matrix.bundles }}
          codesign_certificate: ${{ secrets.CODESIGN_CERTIFICATE }}
          codesign_certificate_password: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
          apple_id: ${{ secrets.APPLE_ID }}
          apple_password: ${{ secrets.APPLE_PASSWORD }}
          apple_team_id: ${{ secrets.APPLE_TEAM_ID }}
          windows_certificate: ${{ secrets.WINDOWS_CERTIFICATE }}
          windows_certificate_password: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

  attach:
    name: attach desktop bundles
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          pattern: hofund-desktop-*
          merge-multiple: true
          path: bundles
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" bundles/* --clobber
              exit 0
            fi
            echo "Waiting for the CLI release $TAG"
            sleep 20
          done
          echo "The CLI release $TAG was not created." >&2
          exit 1
