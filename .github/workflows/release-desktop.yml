# Builds the menu-bar bundles. A version tag publishes them onto the GitHub
# release created by the CLI workflow. workflow_dispatch only uploads workflow
# artifacts. Empty signing secrets skip that step.

name: Release desktop

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: dmg,app
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: windows-latest
            # WiX/MSI rejects a non-numeric prerelease identifier such as
            # "rc" in 0.2.0-rc.1 / 0.2.0-rc.2. NSIS accepts that version.
            # Restore "nsis,msi" for the final 0.2.0 tag.
            bundles: nsis
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Build bundles and checksums
        uses: ./.github/actions/desktop-bundle
        with:
          bundles: ${{ matrix.bundles }}
          codesign_certificate: ${{ secrets.CODESIGN_CERTIFICATE }}
          codesign_certificate_password: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
          apple_id: ${{ secrets.APPLE_ID }}
          apple_password: ${{ secrets.APPLE_PASSWORD }}
          apple_team_id: ${{ secrets.APPLE_TEAM_ID }}
          windows_certificate: ${{ secrets.WINDOWS_CERTIFICATE }}
          windows_certificate_password: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

  attach:
    name: attach desktop bundles
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          pattern: hofund-desktop-*
          # Keep per-platform directories so SHA256SUMS files do not overwrite
          # each other (merge-multiple: true would leave only one checksum file).
          merge-multiple: false
          path: bundles
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p upload
          : > upload/SHA256SUMS
          for dir in bundles/*; do
            [ -d "$dir" ] || continue
            os="${dir##*/}"
            os="${os#hofund-desktop-}"
            if [ -f "$dir/SHA256SUMS" ]; then
              {
                echo "# $os"
                cat "$dir/SHA256SUMS"
              } >> upload/SHA256SUMS
              cp "$dir/SHA256SUMS" "upload/SHA256SUMS.$os"
            fi
            find "$dir" -type f ! -name SHA256SUMS -exec cp -t upload {} +
          done
          test -s upload/SHA256SUMS
          # This job has no checkout, so GH_REPO must be set. Do not hide gh
          # stderr. Wait for the CLI workflow, then create a prerelease stub
          # if it did not, so bundles can still be attached.
          found=0
          for i in $(seq 1 45); do
            if gh release view "$TAG"; then
              found=1
              break
            fi
            echo "Waiting for the CLI release $TAG (attempt $i/45)" >&2
            sleep 20
          done
          if [ "$found" -ne 1 ]; then
            echo "The CLI release $TAG was not created; creating a prerelease stub so desktop bundles can be attached." >&2
            notes="$RUNNER_TEMP/desktop-stub-notes.txt"
            printf '%s\n' 'Preview prerelease. Real-account smoke tests for subscriptions are still pending (#304, #58, #310). Artifacts are unsigned unless repository secrets are set.' > "$notes"
            if ! gh release create "$TAG" --prerelease --target "${GITHUB_SHA}" --title "$TAG" --notes-file "$notes"; then
              echo "gh release create failed (the CLI workflow may have just created it); retrying view." >&2
              gh release view "$TAG"
            fi
          fi
          gh release upload "$TAG" upload/* --clobber
