# Builds the menu-bar bundles. A version tag publishes them onto the GitHub
# release created by the CLI workflow. workflow_dispatch only uploads workflow
# artifacts. Empty signing secrets skip that step.

name: Release desktop

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: dmg,app
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis,msi
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install pinned Rust toolchain
        uses: ./.github/actions/rust-toolchain
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Install Linux host libraries
        if: runner.os == 'Linux'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            -o Dpkg::Options::="--force-confold" \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev
      - name: Install the Tauri CLI
        shell: bash
        run: npm install --global @tauri-apps/cli@2.12.4
      - name: Build bundles
        shell: bash
        working-directory: apps/desktop/src-tauri
        env:
          CODESIGN_CERTIFICATE: ${{ secrets.CODESIGN_CERTIFICATE }}
          CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CODESIGN_CERTIFICATE:-}" ] && [ -n "${CODESIGN_CERTIFICATE_PASSWORD:-}" ]; then
            export APPLE_CERTIFICATE="$CODESIGN_CERTIFICATE"
            export APPLE_CERTIFICATE_PASSWORD="$CODESIGN_CERTIFICATE_PASSWORD"
            echo "Apple signing secrets are present."
          else
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD || true
            echo "Apple signing secrets are absent; signing is skipped."
          fi
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "Apple notarization secrets are present."
          else
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID || true
            echo "Apple notarization secrets are absent; notarization is skipped."
          fi
          tauri build --bundles "${{ matrix.bundles }}"
      - name: Sign Windows bundles
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            Write-Host "Windows signing secrets are absent; signing is skipped."
            exit 0
          }
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $pfx = Join-Path $env:RUNNER_TEMP "hofund.pfx"
          [IO.File]::WriteAllBytes($pfx, $bytes)
          $secure = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure | Out-Null
          $files = Get-ChildItem -Path apps/desktop/src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi
          foreach ($file in $files) {
            & signtool sign /fd SHA256 /a /tr http://timestamp.digicert.com /td SHA256 $file.FullName
          }
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hofund-desktop"
          bundle="apps/desktop/src-tauri/target/release/bundle"
          find "$bundle" -type d -name '*.app' | while read -r app; do
            tar -C "$(dirname "$app")" -czf "$RUNNER_TEMP/hofund-desktop/$(basename "$app").tar.gz" "$(basename "$app")"
          done
          find "$bundle" -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.msi' \) \
            -exec cp {} "$RUNNER_TEMP/hofund-desktop/" \;
          (
            cd "$RUNNER_TEMP/hofund-desktop"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum -- * > SHA256SUMS
            else
              shasum -a 256 -- * > SHA256SUMS
            fi
          )
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hofund-desktop-${{ matrix.os }}
          path: ${{ runner.temp }}/hofund-desktop
          if-no-files-found: error

  attach:
    name: attach desktop bundles
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          pattern: hofund-desktop-*
          merge-multiple: true
          path: bundles
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" bundles/* --clobber
              exit 0
            fi
            echo "Waiting for the CLI release $TAG"
            sleep 20
          done
          echo "The CLI release $TAG was not created." >&2
          exit 1
