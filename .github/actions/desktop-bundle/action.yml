name: desktop-bundle
description: Build the menu-bar bundles and write SHA256SUMS. Does not publish a release.

inputs:
  bundles:
    description: Comma-separated tauri build --bundles value
    required: true
  codesign_certificate:
    description: Base64 Apple Developer ID certificate. Empty skips signing.
    required: false
    default: ""
  codesign_certificate_password:
    description: Password for the Apple certificate.
    required: false
    default: ""
  apple_id:
    description: Apple ID for notarization.
    required: false
    default: ""
  apple_password:
    description: App-specific password for notarization.
    required: false
    default: ""
  apple_team_id:
    description: Apple team id for notarization.
    required: false
    default: ""
  windows_certificate:
    description: Base64 Windows Authenticode certificate. Empty skips signing.
    required: false
    default: ""
  windows_certificate_password:
    description: Password for the Windows certificate.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install pinned Rust toolchain
      uses: ./.github/actions/rust-toolchain
    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
    - name: Install Linux host libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          -o Dpkg::Options::="--force-confold" \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf \
          libxdo-dev
    - name: Install the Tauri CLI
      shell: bash
      run: npm install --global @tauri-apps/cli@2.12.4
    - name: Build bundles
      shell: bash
      working-directory: apps/desktop/src-tauri
      env:
        CODESIGN_CERTIFICATE: ${{ inputs.codesign_certificate }}
        CODESIGN_CERTIFICATE_PASSWORD: ${{ inputs.codesign_certificate_password }}
        APPLE_ID: ${{ inputs.apple_id }}
        APPLE_PASSWORD: ${{ inputs.apple_password }}
        APPLE_TEAM_ID: ${{ inputs.apple_team_id }}
      run: |
        set -euo pipefail
        if [ -n "${CODESIGN_CERTIFICATE:-}" ] && [ -n "${CODESIGN_CERTIFICATE_PASSWORD:-}" ]; then
          export APPLE_CERTIFICATE="$CODESIGN_CERTIFICATE"
          export APPLE_CERTIFICATE_PASSWORD="$CODESIGN_CERTIFICATE_PASSWORD"
          echo "Apple signing secrets are present."
        else
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD || true
          echo "Apple signing secrets are absent; signing is skipped."
        fi
        if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
          echo "Apple notarization secrets are present."
        else
          unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID || true
          echo "Apple notarization secrets are absent; notarization is skipped."
        fi
        tauri build --bundles "${{ inputs.bundles }}"
    - name: Sign Windows bundles
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        WINDOWS_CERTIFICATE: ${{ inputs.windows_certificate }}
        WINDOWS_CERTIFICATE_PASSWORD: ${{ inputs.windows_certificate_password }}
      run: |
        if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE_PASSWORD)) {
          Write-Host "Windows signing secrets are absent; signing is skipped."
          exit 0
        }
        $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
        $pfx = Join-Path $env:RUNNER_TEMP "hofund.pfx"
        [IO.File]::WriteAllBytes($pfx, $bytes)
        $secure = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
        Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure | Out-Null
        $bundle = (bash .github/scripts/desktop-bundle-dir.sh).Trim()
        if (-not (Test-Path -LiteralPath $bundle)) {
          Write-Error "bundle directory does not exist: $bundle"
          exit 1
        }
        $files = Get-ChildItem -Path $bundle -Recurse -Include *.exe,*.msi
        foreach ($file in $files) {
          & signtool sign /fd SHA256 /a /tr http://timestamp.digicert.com /td SHA256 $file.FullName
        }
    - name: Checksums
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/hofund-desktop"
        bundle="$(.github/scripts/desktop-bundle-dir.sh)"
        if [ ! -d "$bundle" ]; then
          echo "bundle directory does not exist: $bundle" >&2
          exit 1
        fi
        find "$bundle" -type d -name '*.app' | while read -r app; do
          tar -C "$(dirname "$app")" -czf "$RUNNER_TEMP/hofund-desktop/$(basename "$app").tar.gz" "$(basename "$app")"
        done
        find "$bundle" -type f \
          \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.msi' \) \
          -exec cp {} "$RUNNER_TEMP/hofund-desktop/" \;
        count="$(find "$RUNNER_TEMP/hofund-desktop" -type f ! -name SHA256SUMS | wc -l | tr -d ' ')"
        if [ "$count" -lt 1 ]; then
          echo "no bundles were found in $bundle" >&2
          exit 1
        fi
        (
          cd "$RUNNER_TEMP/hofund-desktop"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -- * > SHA256SUMS
          else
            shasum -a 256 -- * > SHA256SUMS
          fi
        )
        test -s "$RUNNER_TEMP/hofund-desktop/SHA256SUMS"
    - name: Upload workflow artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hofund-desktop-${{ runner.os }}
        path: ${{ runner.temp }}/hofund-desktop
        if-no-files-found: error
