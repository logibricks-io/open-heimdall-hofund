[package]
name = "hofund-cli"
description = "Command-line interface for the hofund local LLM gateway."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
autobins = false

[[bin]]
name = "hofund"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
hofund-config = { workspace = true }
hofund-control-client = { workspace = true }
hofund-daemon = { workspace = true }
hofund-secrets = { workspace = true }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time"] }
toml_edit = "0.25.17"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1.54.1", features = ["rt", "signal"] }

[dev-dependencies]
http = "1.5.0"
tempfile = { workspace = true }
tokio = { version = "1.54.1", features = ["rt", "time", "test-util"] }

[package.metadata.dist]
dist = true

[lints]
workspace = true
