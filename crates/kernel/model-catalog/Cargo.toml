[package]
name = "hofund-model-catalog"
description = "Vendor-neutral models.dev catalog cache, spec lookup, and local overrides."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
hofund-config = { workspace = true }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
tracing = "0.1.41"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
