[package]
name = "hofund-usage"
description = "Request and token usage records for gateway traffic."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
# `cache` (the default) pulls an older hashbrown through hashlink. The ledger
# does not use the statement cache, so only the bundled SQLite build is enabled.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
hofund-config = { workspace = true }
hofund-model-catalog = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
