[package]
name = "hofund-daemon"
description = "Long-running process that wires configuration, secrets, and the gateway."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = []
test-util = ["hofund-secrets/test-fixtures"]

[dependencies]
hofund-agent = { workspace = true }
hofund-codec = { workspace = true }
hofund-config = { workspace = true }
hofund-control-proto = { workspace = true }
hofund-gateway = { workspace = true }
hofund-plugin-api = { workspace = true }
hofund-plugin-host = { workspace = true }
hofund-plugin-registry = { workspace = true }
hofund-plugin-sdk = { workspace = true }
hofund-model-catalog = { workspace = true }
hofund-provider = { workspace = true }
hofund-quirks = { workspace = true }
hofund-router = { workspace = true }
hofund-secrets = { workspace = true }
hofund-sessions = { workspace = true }
hofund-usage = { workspace = true }
async-trait = "0.1.89"
bytes = "1.12.0"
futures-util = "0.3.32"
notify = { version = "8.2.1", default-features = false, features = ["macos_fsevent"] }
regex = "1.13.1"
toml = "0.8.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["io-std", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5.3"
tracing = "0.1.41"
url = "2.5.7"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
signal-hook = { version = "0.4.5", default-features = false }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29.0", features = ["fs"] }

[lints]
workspace = true

[[test]]
name = "control_group_rename_keys"
path = "tests/control_group_rename_keys.rs"
required-features = ["test-util"]

[dev-dependencies]
hofund-agent = { workspace = true, features = ["test-fixtures"] }
hofund-control-client = { workspace = true }
hofund-daemon = { path = ".", features = ["test-util"] }
hofund-plugin-agent-omp = { workspace = true }
hofund-plugin-agent-pi = { workspace = true }
hofund-plugin-registry = { workspace = true, features = ["test-fixtures"] }
hofund-secrets = { workspace = true, features = ["test-fixtures"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = { workspace = true }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }
wiremock = "0.6.5"
