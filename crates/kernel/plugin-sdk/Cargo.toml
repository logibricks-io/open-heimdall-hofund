[package]
name = "hofund-plugin-sdk"
description = "Helpers plugins share. Calls go through the host HTTP handle."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { workspace = true }
chrono-tz = "0.10.4"
hofund-codec = { workspace = true }
hofund-ir = { workspace = true }
hofund-plugin-api = { workspace = true }
hofund-quirks = { workspace = true }
async-trait = "0.1.89"
base64 = "0.23.1"
bytes = "1.12.0"
futures-util = "0.3.32"
http = "1.5.0"
httpdate = "1.0.3"
iana-time-zone = "0.1.65"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
regex = "1.13.1"
ring = "0.17.14"
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
getrandom = "0.4.3"
secrecy = "0.10.3"
md-5 = "0.10.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.52.2", features = ["sync", "time", "macros", "rt"] }
tracing = "0.1.44"
url = "2.5.8"
webp = "0.3.1"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
zstd = { workspace = true }

[features]
enc-v1-test = []
rsa-test = []
test-host-local = []

[dev-dependencies]
quote = "1.0.45"
syn = { version = "3.0.9", features = ["full"] }
tempfile = { workspace = true }
tokio = { version = "1.52.2", features = ["macros", "rt", "test-util", "time"] }

[lints]
workspace = true
