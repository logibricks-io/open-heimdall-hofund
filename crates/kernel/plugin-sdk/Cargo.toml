[package]
name = "hofund-plugin-sdk"
description = "Helpers plugins share. Calls go through the host HTTP handle."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
hofund-codec = { workspace = true }
hofund-ir = { workspace = true }
hofund-plugin-api = { workspace = true }
hofund-quirks = { workspace = true }
async-trait = "0.1.89"
base64 = "0.22.1"
bytes = "1.12.0"
futures-util = "0.3.32"
http = "1.5.0"
httpdate = "1.0.3"
regex = "1.13.1"
ring = "0.17.14"
secrecy = "0.10.3"
serde_json = "1.0.154"
tokio = { version = "1.52.2", features = ["sync", "time"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
quote = "1.0.45"
syn = { version = "3.0.9", features = ["full"] }
tempfile = { workspace = true }
tokio = { version = "1.52.2", features = ["macros", "rt", "test-util", "time"] }

[lints]
workspace = true
