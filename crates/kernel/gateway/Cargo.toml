[package]
name = "hofund-gateway"
description = "Axum HTTP server and middleware pipeline for the local LLM gateway."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = "0.3.34"
hofund-codec = { workspace = true }
hofund-control-proto = { workspace = true }
hofund-ir = { workspace = true }
hofund-plugin-api = { workspace = true }
hofund-plugin-host = { workspace = true }
hofund-router = { workspace = true }
hofund-secrets = { workspace = true }
hofund-usage = { workspace = true }
base64 = "0.23.1"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
ring = "0.17.14"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
metrics = "0.24.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower = "0.5.3"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
async-trait = "0.1.92"
bytes = "1.12.0"
futures-util = "0.3.34"
hofund-codec = { workspace = true }
hofund-ir = { workspace = true }
hofund-plugin-api = { workspace = true }
hofund-router = { workspace = true }
hofund-secrets = { workspace = true }
hofund-usage = { workspace = true }
serde_json = "1.0.154"
tempfile = { workspace = true }
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt-multi-thread", "test-util"] }
tokio-tungstenite = "0.30.0"
tower = "0.5.3"
