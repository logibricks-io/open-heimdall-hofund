[package]
name = "hofund-plugin-host"
description = "Backend traits' constructor for HostContext. Plugins do not depend on this crate."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
hofund-plugin-api = { workspace = true, features = ["kernel", "kernel-internal"] }
async-trait = "0.1.89"
bytes = "1.12.0"
futures-util = "0.3.32"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
tokio = { version = "1.52.2", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
getrandom = { version = "0.4.3", features = ["std"] }
secrecy = "0.10.3"
tracing = "0.1.44"
url = "2.5.8"
zeroize = "1.9.1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
security-framework = "3.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
keyring-core = "1.0.1"
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "vendored"] }
dbus-secret-service = { version = "4.1.0", features = ["vendored"] }

[dev-dependencies]
hofund-plugin-sdk = { workspace = true }
tempfile = { workspace = true }
tokio = { version = "1.52.2", features = ["macros", "rt", "time"] }

[lints]
workspace = true
