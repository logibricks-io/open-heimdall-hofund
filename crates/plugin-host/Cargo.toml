[package]
name = "hofund-plugin-host"
description = "Backend traits' constructor for HostContext. Plugins do not depend on this crate."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
hofund-plugin-api = { workspace = true, features = ["kernel"] }
async-trait = "0.1.89"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
tokio = { version = "1.52.2", features = ["rt", "time"] }

[dev-dependencies]
futures-util = "0.3.32"
hofund-plugin-sdk = { workspace = true }
tokio = { version = "1.52.2", features = ["macros", "rt", "time"] }

[lints]
workspace = true
