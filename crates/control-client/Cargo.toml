[package]
name = "hofund-control-client"
description = "Typed TCP client for the hofund control protocol."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
hofund-control-proto = { workspace = true }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["net", "rt"] }

[dev-dependencies]
hyper = { version = "1.12.0", features = ["server"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
