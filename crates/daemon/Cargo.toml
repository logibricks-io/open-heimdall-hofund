[package]
name = "hofund-daemon"
description = "Long-running process that wires configuration, secrets, and the gateway."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
hofund-codec = { workspace = true }
hofund-config = { workspace = true }
hofund-gateway = { workspace = true }
hofund-provider = { workspace = true }
hofund-quirks = { workspace = true }
hofund-router = { workspace = true }
hofund-secrets = { workspace = true }
hofund-usage = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time"] }

[lints]
workspace = true

[dev-dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
