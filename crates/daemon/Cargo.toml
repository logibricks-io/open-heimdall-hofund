[package]
name = "hofund-daemon"
description = "Long-running process that wires configuration, secrets, and the gateway."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = []
test-util = []

[dependencies]
hofund-agent = { workspace = true }
hofund-codec = { workspace = true }
hofund-config = { workspace = true }
hofund-control-proto = { workspace = true }
hofund-gateway = { workspace = true }
hofund-plugin-api = { workspace = true }
hofund-plugin-host = { workspace = true }
hofund-plugin-registry = { workspace = true }
hofund-plugin-sdk = { workspace = true }
hofund-provider = { workspace = true }
hofund-quirks = { workspace = true }
hofund-router = { workspace = true }
hofund-secrets = { workspace = true }
hofund-usage = { workspace = true }
async-trait = "0.1.89"
bytes = "1.12.0"
futures-util = "0.3.32"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower = "0.5.3"
tracing = "0.1.41"
url = "2.5.7"

[lints]
workspace = true

[dev-dependencies]
hofund-daemon = { path = ".", features = ["test-util"] }
hofund-plugin-registry = { workspace = true, features = ["test-fixtures"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util", "time"] }
wiremock = "0.6.5"
