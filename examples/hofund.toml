# Example hofund configuration.
#
# Copy this file to the platform config path (hofund/hofund.toml under
# XDG_CONFIG_HOME or ~/.config on Unix, ~/Library/Application Support on
# macOS, %APPDATA% on Windows), or pass it with --config.
#
#   hofund config check --config examples/hofund.toml
#
# api_key may be a literal or env:NAME. env:NAME reads that variable when
# the gateway starts. token_file and usage_file are relative to this file.

listen = "127.0.0.1:3425"

[[providers]]
id = "primary"
protocol = "openai-chat"
base_url = "http://127.0.0.1:4000/v1"
api_key = "replace-me"
# patience is optional. A direct request to this provider waits out busy
# failures for 60 seconds by default, with pauses doubling to 30 seconds.
# Set seconds or a duration up to 240 seconds, or "off" to disable retries.
# patience = 60

# Point base_url at a local mock. A placeholder key must not be paired with
# a real vendor host, or a check of this file can send traffic.
# max_output_tokens is optional. It fills max_tokens when the client omits
# one. A route member can set a smaller cap. Messages still sends 16384 when
# neither is set. Zero is rejected.
# protocol is a codec id: openai-chat, openai-responses, anthropic-messages,
# generative-language, or bedrock-converse. A preset may omit it.
# preset = "google" speaks generateContent. protocol = "openai-chat" on that
# preset keeps the OpenAI-compatible root.
# [[providers]]
# id = "openai"
# preset = "openai"
# protocol = "openai-responses"
# api_key = "env:OPENAI_API_KEY"
# Optional host-owned model listing settings. url is an exact list URL and may
# be env:NAME; its resolved value and query are redacted. refresh accepts off,
# fractional days, or a duration of at least 10m. auto_include is stored for the
# later refresh job; this version does not start that job or apply the rules.
# [providers.models]
# refresh = "1h"
# auto_include = ["gpt-*", "re:claude"]
# url = "env:OPENAI_MODELS_URL"

[[providers]]
id = "backup"
protocol = "anthropic-messages"
base_url = "http://127.0.0.1:4001"
api_key = "replace-me-too"

# Generative Language (`generateContent`). The key is sent as
# `x-goog-api-key`, not as a bearer token. A bare host is completed with
# `/v1beta`. A pasted `:generateContent` URL is cut back to that base.
# The model is a path segment, so it is not a field of the JSON body.
# [[providers]]
# id = "studio"
# protocol = "generative-language"
# base_url = "https://generativelanguage.googleapis.com"
# api_key = "env:GEMINI_API_KEY"
# [[providers]]
# id = "gemini"
# preset = "google"
# api_key = "env:GEMINI_API_KEY"
# Google Vertex AI. No API key. The plugin reads project, location,
# credentials, and impersonate from [providers.options]. The old top-level
# keys still load for one release and are copied into that table.
# A credentials path may start with `~/`. Leave it empty, or omit it, to use
# Application Default Credentials. impersonate is the service-account email.
# Do not paste a key or a service-account JSON here.
# [[providers]]
# id = "vertex"
# preset = "google-vertex"
# [providers.options]
# project = "my-project"
# location = "global"
# credentials = "~/adc.json"
# impersonate = "worker@example.iam.gserviceaccount.com"
# Bedrock Converse. SigV4, not a Bedrock API key. region selects the runtime
# host and is the signing region. Chat and Messages on this preset still use
# api_key and do not set these options.
# [[providers]]
# id = "bedrock"
# preset = "bedrock"
# protocol = "bedrock-converse"
# [providers.options]
# region = "us-east-1"
# access_key_id = "env:AWS_ACCESS_KEY_ID"
# secret_access_key = "env:AWS_SECRET_ACCESS_KEY"
# session_token = "env:AWS_SESSION_TOKEN"
# A subscription names which accounts to serve. `*` is every account stored
# for that plugin. Vendor host and client id sit in [subscriptions.options].
# [[subscriptions]]
# id = "copilot"
# accounts = "*"
# [subscriptions.options]
# host = "example.ghe.com"
# Azure OpenAI. `base_url` may be the resource name, the resource URL, or a
# pasted deployment URL. Chat and Responses use `https://<host>/openai/v1`.
# The key is sent as `api-key`. A deployment's name is the model id.
# [[providers]]
# id = "azure"
# preset = "azure"
# base_url = "my-resource"
# api_key = "env:AZURE_OPENAI_API_KEY"

# Routing defaults to smart. order, rotate, weight, and free are implemented;
# smart, usage, pace, fast, and cheap currently keep the listed order until
# P0-2b. cheap is valid only on a multi-upstream or subscription group.
# Weights are integers of at least 1; omitted and 1 are the default. Provider
# free = true marks every model free; cached catalog free flags and all-zero
# prices are used otherwise. Account weights go in [subscriptions.account_weights]
# with lower-cased account ids as keys. hofund routes prints the strategy names.
[[routes]]
model = "demo"
routing = "weight"
upstreams = [{ provider = "primary", weight = 3 }, "backup"]
