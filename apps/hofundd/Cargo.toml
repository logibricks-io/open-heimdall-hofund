[package]
name = "hofund-daemon-bin"
description = "The hofundd daemon process: the gateway, its control plane, and the plugin registry."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
autobins = false

[[bin]]
name = "hofundd"
path = "src/main.rs"

[dependencies]
hofund-bridge-mcp = { workspace = true }
hofund-daemon = { workspace = true }
hofund-plugin-api = { workspace = true }
hofund-plugin-registry = { workspace = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "std", "tracing-log"] }

[dev-dependencies]
hofund-agent = { workspace = true }
log = "0.4.34"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde_json = "1.0.154"
tempfile = { workspace = true }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "time"] }
wiremock = "0.6.5"

[package.metadata.dist]
dist = true

[lints]
workspace = true
