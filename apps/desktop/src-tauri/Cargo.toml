[package]
name = "hofund-desktop"
description = "Menu-bar application for the hofund local gateway."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[package.metadata.dist]
dist = false

[dependencies]
hofund-agent = { workspace = true }
hofund-daemon = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "custom-protocol"] }
tokio = { version = "1.54.1", features = ["sync"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
