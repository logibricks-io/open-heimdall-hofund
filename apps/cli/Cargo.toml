[package]
name = "hofund-cli"
description = "Command-line interface for the hofund local LLM gateway."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
autobins = false

[[bin]]
name = "hofund"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
hofund-config = { workspace = true }
hofund-control-client = { workspace = true }
hofund-plugin-agent-claude = { workspace = true }
hofund-plugin-agent-cindy = { workspace = true }
hofund-plugin-agent-cline = { workspace = true }
hofund-plugin-agent-codex = { workspace = true }
hofund-plugin-agent-cursor = { workspace = true }
hofund-plugin-agent-droid = { workspace = true }
hofund-plugin-agent-grok = { workspace = true }
hofund-plugin-agent-kimi = { workspace = true }
hofund-plugin-agent-qoder = { workspace = true }
hofund-plugin-agent-minimax-code = { workspace = true }
hofund-plugin-agent-raft = { workspace = true }
hofund-plugin-api = { workspace = true }
hofund-sessions = { workspace = true }
hofund-usage = { workspace = true }
hofund-model-catalog = { workspace = true }
hofund-secrets = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { workspace = true }
tokio = { version = "1.54.1", features = ["macros", "rt", "signal", "time"] }
toml_edit = "0.25.17"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1.54.1", features = ["rt", "signal"] }

[dev-dependencies]
hofund-control-proto = { workspace = true }
http = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = { workspace = true }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
wiremock = "0.6.5"

[package.metadata.dist]
dist = true

[lints]
workspace = true
