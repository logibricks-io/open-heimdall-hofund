# Advisories, licenses, bans, and sources for `cargo deny check`.
# Vulnerability advisories always fail the check. Yanked crates fail below.

[graph]
# CI builds these three targets. The wasm32 SQLite backend is not shipped and
# pulls a second hashbrown, so it stays outside this graph.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    # ring 0.17 still depends on windows-sys 0.52 here. The skip below names it.
    "aarch64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"

[licenses]
version = 2
confidence-threshold = 0.8
# The allow list is project policy. Crates are not required to use every entry yet.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
private = { ignore = false }

[bans]
multiple-versions = "deny"
wildcards = "deny"
workspace-default-features = "allow"
external-default-features = "allow"
# The HTTP stack does not agree on these crates. Skipping the older copy keeps
# the ban in force for every other duplicate.
skip = [
    { crate = "base64@0.21.7", reason = "tauri-utils depends on swift-rs, which depends on base64 0.21, while hyper-util depends on 0.23" },
    { crate = "base64@0.22.1", reason = "reqwest 0.12 depends on base64 0.22 while hyper-util depends on 0.23" },
    { crate = "bitflags@1.3.2", reason = "webkit2gtk 2.0 depends on bitflags 1 while the rest of the graph uses bitflags 2" },
    { crate = "getrandom@0.3.4", reason = "tauri 2.12 depends on getrandom 0.3 while ring 0.17 stays on 0.2" },
    { crate = "getrandom@0.4.3", reason = "tauri-utils pulls getrandom 0.4 through uuid while ring 0.17 stays on 0.2" },
    { crate = "hashbrown@0.12.3", reason = "schemars 0.8, via tauri-utils, depends on indexmap 1 and hashbrown 0.12" },
    { crate = "heck@0.4.1", reason = "glib-macros 0.18 depends on heck 0.4 while system-deps depends on 0.5" },
    { crate = "indexmap@1.9.3", reason = "schemars 0.8, via tauri-utils, depends on indexmap 1 while hyper depends on indexmap 2" },
    { crate = "miniz_oxide@0.8.9", reason = "png 0.18, via the menu-bar icons, depends on miniz_oxide 0.8 while flate2 depends on 0.9" },
    { crate = "proc-macro-crate@1.3.1", reason = "gtk3-macros 0.18 depends on proc-macro-crate 1 while glib-macros depends on 2" },
    { crate = "serde_spanned@0.6.9", reason = "system-deps 6 depends on toml 0.8 and serde_spanned 0.6 while the workspace toml uses 1" },
    { crate = "syn@1.0.109", reason = "glib-macros 0.18 depends on proc-macro-error and syn 1 while the workspace uses syn 3" },
    { crate = "syn@2.0.119", reason = "tauri-utils depends on derive_more, which depends on syn 2, while the workspace uses syn 3" },
    { crate = "thiserror@1.0.69", reason = "the gtk-rs 0.18 stack depends on thiserror 1 while the workspace uses thiserror 2" },
    { crate = "thiserror-impl@1.0.69", reason = "the gtk-rs 0.18 stack depends on thiserror 1 while the workspace uses thiserror 2" },
    { crate = "toml@0.8.2", reason = "system-deps 6 depends on toml 0.8 while the workspace uses toml 1" },
    { crate = "toml_datetime@0.6.3", reason = "glib-macros depends on proc-macro-crate 2 and toml_datetime 0.6 while the workspace toml uses 1" },
    { crate = "toml_edit@0.19.15", reason = "gtk3-macros depends on proc-macro-crate 1 and toml_edit 0.19 while the workspace uses 0.25" },
    { crate = "toml_edit@0.20.2", reason = "glib-macros depends on proc-macro-crate 2 and toml_edit 0.20 while the workspace uses 0.25" },
    { crate = "windows-sys@0.52.0", reason = "ring 0.17 depends on windows-sys 0.52 while tokio depends on 0.61" },
    { crate = "winnow@0.5.40", reason = "gtk3-macros depends on toml_edit 0.19 and winnow 0.5 while the workspace toml uses winnow 1" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
