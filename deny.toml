# Advisories, licenses, bans, and sources for `cargo deny check`.
# Vulnerability advisories always fail the check. Yanked crates fail below.

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"

[licenses]
version = 2
confidence-threshold = 0.8
# The allow list is project policy. Crates are not required to use every entry yet.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
private = { ignore = false }

[bans]
multiple-versions = "deny"
wildcards = "deny"
workspace-default-features = "allow"
external-default-features = "allow"
# The HTTP stack does not agree on these crates. Skipping the older copy keeps
# the ban in force for every other duplicate.
skip = [
    { crate = "base64@0.22.1", reason = "reqwest 0.12 depends on base64 0.22 while hyper-util depends on 0.23" },
    { crate = "windows-sys@0.52.0", reason = "ring 0.17 depends on windows-sys 0.52 while tokio depends on 0.61" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
