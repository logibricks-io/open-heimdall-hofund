[workspace]
resolver = "3"
members = [
    "apps/cli",
    "apps/desktop/src-tauri",
    "apps/hofundd",
    "crates/kernel/agent",
    "crates/kernel/codec",
    "crates/kernel/config",
    "crates/control-client",
    "crates/control-proto",
    "crates/kernel/daemon",
    "crates/kernel/gateway",
    "crates/kernel/ir",
    "crates/kernel/plugin-api",
    "crates/kernel/plugin-host",
    "crates/kernel/plugin-sdk",
    "plugins/inbound/codex-catalog",
    "plugins/inbound/retrieval",
    "plugins/inbound/echo",
    "plugins/inbound/muse",
    "plugins/inbound/ollama",
    "plugins/providers/azure",
    "plugins/providers/bedrock",
    "plugins/providers/bedrock-mantle",
    "plugins/providers/fixture",
    "plugins/providers/google-vertex",
    "plugins/providers/plan-quota",
    "plugins/providers/relay",
    "plugins/providers/remote-gateway",
    "plugins/registry",
    "plugins/subscriptions/claude",
    "plugins/subscriptions/codex",
    "plugins/subscriptions/copilot",
    "plugins/subscriptions/gemini",
    "crates/kernel/provider",
    "kits/agent",
    "kits/subscription",
    "kits/upstream",
    "crates/kernel/quirks",
    "crates/kernel/router",
    "crates/kernel/secrets",
    "crates/kernel/usage",
    "xtask",
]
default-members = ["apps/cli"]

[workspace.package]
version = "0.1.0"
authors = ["LogiBricks"]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/logibricks-io/open-heimdall-hofund"
homepage = "https://github.com/logibricks-io/open-heimdall-hofund"
rust-version = "1.99.1"

# Repeat the package version on each path dependency. `workspace = true` without
# a version is a wildcard, which `cargo deny` rejects.
[workspace.dependencies]
hofund-agent = { version = "0.1.0", path = "crates/kernel/agent" }
hofund-codec = { version = "0.1.0", path = "crates/kernel/codec" }
hofund-config = { version = "0.1.0", path = "crates/kernel/config" }
hofund-control-client = { version = "0.1.0", path = "crates/control-client" }
hofund-control-proto = { version = "0.1.0", path = "crates/control-proto" }
hofund-daemon = { version = "0.1.0", path = "crates/kernel/daemon" }
hofund-gateway = { version = "0.1.0", path = "crates/kernel/gateway" }
hofund-ir = { version = "0.1.0", path = "crates/kernel/ir" }
hofund-kit-agent = { version = "0.1.0", path = "kits/agent" }
hofund-kit-subscription = { version = "0.1.0", path = "kits/subscription" }
hofund-kit-upstream = { version = "0.1.0", path = "kits/upstream" }
hofund-plugin-api = { version = "0.1.0", path = "crates/kernel/plugin-api" }
hofund-plugin-azure = { version = "0.1.0", path = "plugins/providers/azure" }
hofund-plugin-bedrock = { version = "0.1.0", path = "plugins/providers/bedrock" }
hofund-plugin-bedrock-mantle = { version = "0.1.0", path = "plugins/providers/bedrock-mantle" }
hofund-plugin-google-vertex = { version = "0.1.0", path = "plugins/providers/google-vertex" }
hofund-plugin-host = { version = "0.1.0", path = "crates/kernel/plugin-host" }
hofund-plugin-echo = { version = "0.1.0", path = "plugins/inbound/echo" }
hofund-plugin-codex-catalog = { version = "0.1.0", path = "plugins/inbound/codex-catalog" }
hofund-plugin-retrieval = { version = "0.1.0", path = "plugins/inbound/retrieval" }
hofund-plugin-muse = { version = "0.1.0", path = "plugins/inbound/muse" }
hofund-plugin-ollama = { version = "0.1.0", path = "plugins/inbound/ollama" }
hofund-plugin-plan-quota = { version = "0.1.0", path = "plugins/providers/plan-quota" }
hofund-plugin-registry = { version = "0.1.0", path = "plugins/registry" }
hofund-plugin-relay = { version = "0.1.0", path = "plugins/providers/relay" }
hofund-plugin-remote-gateway = { version = "0.1.0", path = "plugins/providers/remote-gateway" }
hofund-plugin-subscription-claude = { version = "0.1.0", path = "plugins/subscriptions/claude" }
hofund-plugin-subscription-codex = { version = "0.1.0", path = "plugins/subscriptions/codex" }
hofund-plugin-subscription-copilot = { version = "0.1.0", path = "plugins/subscriptions/copilot" }
hofund-plugin-subscription-gemini = { version = "0.1.0", path = "plugins/subscriptions/gemini" }
hofund-plugin-sdk = { version = "0.1.0", path = "crates/kernel/plugin-sdk" }
hofund-provider = { version = "0.1.0", path = "crates/kernel/provider" }
hofund-quirks = { version = "0.1.0", path = "crates/kernel/quirks" }
hofund-router = { version = "0.1.0", path = "crates/kernel/router" }
hofund-secrets = { version = "0.1.0", path = "crates/kernel/secrets" }
hofund-usage = { version = "0.1.0", path = "crates/kernel/usage" }
sha2 = "0.10.9"
tempfile = "3.27.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }
# Transitive duplicates from the HTTP stack (base64, getrandom, windows-sys)
# cannot be unified from this workspace. `deny.toml` names the skipped crates.
multiple_crate_versions = "allow"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
