[workspace]
resolver = "3"
members = [
    "apps/desktop/src-tauri",
    "crates/agent",
    "crates/cli",
    "crates/codec",
    "crates/config",
    "crates/control-client",
    "crates/control-proto",
    "crates/daemon",
    "crates/gateway",
    "crates/ir",
    "crates/plugin-api",
    "crates/plugin-host",
    "crates/plugin-sdk",
    "plugins/inbound/echo",
    "plugins/providers/fixture",
    "plugins/providers/relay",
    "plugins/registry",
    "crates/provider",
    "kits/agent",
    "kits/subscription",
    "kits/upstream",
    "crates/quirks",
    "crates/router",
    "crates/secrets",
    "crates/usage",
    "xtask",
]
default-members = ["crates/cli"]

[workspace.package]
version = "0.1.0"
authors = ["LogiBricks"]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/logibricks-io/open-heimdall-hofund"
homepage = "https://github.com/logibricks-io/open-heimdall-hofund"
rust-version = "1.99.1"

# Repeat the package version on each path dependency. `workspace = true` without
# a version is a wildcard, which `cargo deny` rejects.
[workspace.dependencies]
hofund-agent = { version = "0.1.0", path = "crates/agent" }
hofund-codec = { version = "0.1.0", path = "crates/codec" }
hofund-config = { version = "0.1.0", path = "crates/config" }
hofund-control-client = { version = "0.1.0", path = "crates/control-client" }
hofund-control-proto = { version = "0.1.0", path = "crates/control-proto" }
hofund-daemon = { version = "0.1.0", path = "crates/daemon" }
hofund-gateway = { version = "0.1.0", path = "crates/gateway" }
hofund-ir = { version = "0.1.0", path = "crates/ir" }
hofund-kit-agent = { version = "0.1.0", path = "kits/agent" }
hofund-kit-subscription = { version = "0.1.0", path = "kits/subscription" }
hofund-kit-upstream = { version = "0.1.0", path = "kits/upstream" }
hofund-plugin-api = { version = "0.1.0", path = "crates/plugin-api" }
hofund-plugin-host = { version = "0.1.0", path = "crates/plugin-host" }
hofund-plugin-echo = { version = "0.1.0", path = "plugins/inbound/echo" }
hofund-plugin-registry = { version = "0.1.0", path = "plugins/registry" }
hofund-plugin-relay = { version = "0.1.0", path = "plugins/providers/relay" }
hofund-plugin-sdk = { version = "0.1.0", path = "crates/plugin-sdk" }
hofund-provider = { version = "0.1.0", path = "crates/provider" }
hofund-quirks = { version = "0.1.0", path = "crates/quirks" }
hofund-router = { version = "0.1.0", path = "crates/router" }
hofund-secrets = { version = "0.1.0", path = "crates/secrets" }
hofund-usage = { version = "0.1.0", path = "crates/usage" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }
# Transitive duplicates from the HTTP stack (base64, getrandom, windows-sys)
# cannot be unified from this workspace. `deny.toml` names the skipped crates.
multiple_crate_versions = "allow"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
