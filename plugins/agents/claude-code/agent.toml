id = "claude-code"
display_name = "Claude Code"
binary = "claude"

# A non-empty value is the calling agent's id or binary.
request_agent_header = "x-claude-code-agent-id"

# The file is ~/.claude/settings.json. On Windows that is
# %USERPROFILE%\.claude\settings.json. CLAUDE_CONFIG_DIR replaces the .claude
# directory. The file is strict JSON; comments are a syntax error in current
# Claude Code, and this adapter still accepts a loosened form so a commented
# file can be edited and later restored.
[[file]]
id = "settings"
kind = "json"
linux = "~/.claude/settings.json"
macos = "~/.claude/settings.json"
windows = "~/.claude/settings.json"
env_override = "CLAUDE_CONFIG_DIR"
env_replaces = "~/.claude"

# env.ANTHROPIC_BASE_URL is the gateway origin. The Claude SDK appends
# /v1/messages, so the value has no /v1 suffix.
[[set]]
file = "settings"
key = "env.ANTHROPIC_BASE_URL"
slot = "origin"

# env.ANTHROPIC_AUTH_TOKEN is sent as Authorization: Bearer.
[[set]]
file = "settings"
key = "env.ANTHROPIC_AUTH_TOKEN"
slot = "token"

# A string model already in the file stays. When the file has none and the
# gateway has one route, connect writes that route as model.
[[set]]
file = "settings"
key = "model"
slot = { model_if_unset = {} }

# Opus, Sonnet, Haiku, and ANTHROPIC_SMALL_FAST_MODEL then name that same model.
[[set]]
file = "settings"
key = "env.ANTHROPIC_DEFAULT_OPUS_MODEL"
slot = { model_tier = { tier = "opus" } }

[[set]]
file = "settings"
key = "env.ANTHROPIC_DEFAULT_SONNET_MODEL"
slot = { model_tier = { tier = "sonnet" } }

[[set]]
file = "settings"
key = "env.ANTHROPIC_DEFAULT_HAIKU_MODEL"
slot = { model_tier = { tier = "haiku" } }

# Fable is written only when the model id contains claude-fable-; a non-Fable id
# in ANTHROPIC_DEFAULT_FABLE_MODEL makes Claude Code treat the main model as Fable.
[[set]]
file = "settings"
key = "env.ANTHROPIC_DEFAULT_FABLE_MODEL"
slot = { model_tier = { tier = "fable", when_model_matches = "claude-fable-" } }

[[set]]
file = "settings"
key = "env.ANTHROPIC_SMALL_FAST_MODEL"
slot = { model_tier = { tier = "fast" } }

# CLAUDE_CODE_SUBAGENT_MODEL stays unset so a subagent that names no model keeps
# the session model. effortLevel and CLAUDE_CODE_EFFORT_LEVEL stay unset because
# connect does not pick a level.
# Checked 2026-10-25: https://code.claude.com/docs/en/model-config,
# https://code.claude.com/docs/en/env-vars.
# Sources: https://code.claude.com/docs/en/settings,
# https://code.claude.com/docs/en/llm-gateway-connect,
# https://code.claude.com/docs/en/env-vars.
[model]
file = "settings"
key = "model"
