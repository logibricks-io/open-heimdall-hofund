id = "gemini-cli"
display_name = "Gemini CLI"
binary = "gemini"

# User settings are ~/.gemini/settings.json. GEMINI_CLI_HOME is the parent
# directory: .gemini is created inside it. Gemini CLI's homedir() in
# packages/core/src/utils/paths.ts returns GEMINI_CLI_HOME when set, and
# getGlobalGeminiDir in packages/core/src/config/storage.ts joins that home
# with .gemini. Both files deliberately follow that resolution instead of
# always using the user home (reference: internal/agent/gemini.go:28-31);
# trace discovery uses the same override
# (reference: internal/sessions/traces_gemini.go:17-22).
[[file]]
id = "settings"
kind = "json"
linux = "~/.gemini/settings.json"
macos = "~/.gemini/settings.json"
windows = "~/.gemini/settings.json"
env_override = "GEMINI_CLI_HOME"
env_replaces = "~"
create = true

# .gemini/.env is loaded by the CLI and is not excluded. Empty and relative
# GEMINI_CLI_HOME values are treated as unset, matching the reference's
# path-variable rule (internal/appdir/env.go:101-107).
[[file]]
id = "env"
kind = "env"
linux = "~/.gemini/.env"
macos = "~/.gemini/.env"
windows = "~/.gemini/.env"
env_override = "GEMINI_CLI_HOME"
env_replaces = "~"
create = true

# security.auth.selectedType is set to gemini-api-key. The string values of
# that enum are not listed in the public docs; they come from
# packages/core/src/core/contentGenerator.ts (gemini-api-key, oauth-personal,
# vertex-ai, cloud-shell, compute-default-credentials, gateway).
[[set]]
file = "settings"
key = "security.auth.selectedType"
slot = { literal = "gemini-api-key" }

# .env sets GEMINI_API_KEY, GOOGLE_GEMINI_BASE_URL (the origin; HTTP to
# localhost is allowed), and GEMINI_API_KEY_AUTH_MECHANISM=bearer.
[[set]]
file = "env"
key = "GEMINI_API_KEY"
slot = "token"

[[set]]
file = "env"
key = "GOOGLE_GEMINI_BASE_URL"
slot = "origin"

# GEMINI_API_KEY_AUTH_MECHANISM is real. It is not listed on the public
# configuration page. In contentGenerator.ts the default is x-goog-api-key.
# The value bearer adds Authorization: Bearer ${apiKey} only when the auth
# type is gemini-api-key or vertex-ai and an API key is set. The gateway auth
# type does not get that header. contentGenerator.test.ts covers it ("should
# pass api key as Authorization Header when GEMINI_API_KEY_AUTH_MECHANISM is
# set to bearer").
#
# getAuthTypeFromEnv returns gateway when GOOGLE_GEMINI_BASE_URL is set,
# before it considers GEMINI_API_KEY. Non-interactive startup uses the
# settings value first (configuredAuthType || getAuthTypeFromEnv() in
# packages/cli/src/validateNonInterActiveAuth.ts), so gemini-api-key wins.
# createContentGenerator still uses GOOGLE_GEMINI_BASE_URL as the SDK base URL
# for that auth type. The SDK sends x-goog-api-key when an API key is passed.
# The gateway accepts either header, compared in constant time, and serves
# POST /v1beta/models/{model}:generateContent and :streamGenerateContent.
[[set]]
file = "env"
key = "GEMINI_API_KEY_AUTH_MECHANISM"
slot = { literal = "bearer" }

# The selected model is model.name. A string model is moved there. An existing
# model.name is left as the user wrote it. When neither is set and the gateway
# has one route, connect writes that route.
# Checked 2026-10-25: https://geminicli.com/docs/reference/configuration/.
# Sources: https://geminicli.com/docs/reference/configuration/,
# https://geminicli.com/docs/get-started/authentication/,
# https://github.com/google-gemini/gemini-cli/blob/main/packages/core/src/core/contentGenerator.ts,
# https://github.com/google-gemini/gemini-cli/blob/main/packages/core/src/core/contentGenerator.test.ts,
# https://github.com/google-gemini/gemini-cli/blob/main/packages/cli/src/validateNonInterActiveAuth.ts.
[[set]]
file = "settings"
key = "model.name"
slot = { model_if_unset = { from = "model" } }

[model]
file = "settings"
key = "model.name"
