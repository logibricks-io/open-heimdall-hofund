# Row moved from the kernel catalog (`crates/provider/presets.toml`), recorded
# from the reference preset list (`internal/provider/presets.go`) at commit
# cbbf3163cb3c87ee0c327a56bc5689ddc5eda947. The preset id is the plugin id.
# Chat and Responses take a region's `/v1` URL and Messages its `/anthropic`
# URL. The plugin picks `/v1` or `/openai/v1` per model on Chat and Responses.

[[preset]]
id = "bedrock-mantle"
name = "Amazon Bedrock (Mantle)"
short = "Bedrock Mantle"
kind = "vendor"
note = "Bedrock API key"
chat = "https://bedrock-mantle.us-east-1.api.aws/v1"
responses = "https://bedrock-mantle.us-east-1.api.aws/v1"
anthropic = "https://bedrock-mantle.us-east-1.api.aws/anthropic"
website = "https://docs.aws.amazon.com/bedrock/latest/userguide/endpoints.html"
keys_url = "https://console.aws.amazon.com/bedrock/home#/api-keys"
hosts = true

[[preset.region]]
id = "us-east-1"
name = "us-east-1"
chat = "https://bedrock-mantle.us-east-1.api.aws/v1"
responses = "https://bedrock-mantle.us-east-1.api.aws/v1"
anthropic = "https://bedrock-mantle.us-east-1.api.aws/anthropic"

