[package]
name = "hofund-plugin-subscription-claude"
description = "Claude Code subscription: sign-in through the claude command line, credentials kept per account, and request serving through the MCP bridge."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
hofund-plugin-api = { workspace = true }
bytes = "1.12.0"
futures-util = "0.3.32"
hofund-plugin-sdk = { workspace = true }
regex = "1.13.1"
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-normalization = "0.1.24"

[dev-dependencies]
hofund-kit-subscription = { workspace = true }
hofund-plugin-sdk = { workspace = true, features = ["test-host-local"] }
tempfile = { workspace = true }

[lints]
workspace = true
