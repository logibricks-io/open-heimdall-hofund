[package]
name = "hofund-plugin-registry"
description = "Compile-time composition of in-tree plugins."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = ["azure", "bedrock", "bedrock-mantle", "claude", "codex", "copilot", "echo", "gemini", "google-vertex", "relay", "remote-gateway"]
azure = ["dep:hofund-plugin-azure"]
bedrock = ["dep:hofund-plugin-bedrock"]
bedrock-mantle = ["dep:hofund-plugin-bedrock-mantle"]
claude = ["dep:hofund-plugin-subscription-claude"]
codex = ["dep:hofund-plugin-subscription-codex"]
copilot = ["dep:hofund-plugin-subscription-copilot"]
echo = ["dep:hofund-plugin-echo"]
gemini = ["dep:hofund-plugin-subscription-gemini"]
google-vertex = ["dep:hofund-plugin-google-vertex"]
relay = ["dep:hofund-plugin-relay"]
remote-gateway = ["dep:hofund-plugin-remote-gateway"]
test-fixtures = []

[dependencies]
futures-util = "0.3.32"
hofund-plugin-api = { workspace = true, features = ["kernel-internal"] }
hofund-plugin-sdk = { workspace = true }
hofund-plugin-azure = { workspace = true, optional = true }
hofund-plugin-bedrock = { workspace = true, optional = true }
hofund-plugin-bedrock-mantle = { workspace = true, optional = true }
hofund-plugin-echo = { workspace = true, optional = true }
hofund-plugin-google-vertex = { workspace = true, optional = true }
hofund-plugin-relay = { workspace = true, optional = true }
hofund-plugin-remote-gateway = { workspace = true, optional = true }
hofund-plugin-subscription-claude = { workspace = true, optional = true }
hofund-plugin-subscription-codex = { workspace = true, optional = true }
hofund-plugin-subscription-copilot = { workspace = true, optional = true }
hofund-plugin-subscription-gemini = { workspace = true, optional = true }
hofund-provider = { workspace = true }
hofund-quirks = { workspace = true }

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.8.2"

[dev-dependencies]
hofund-agent = { workspace = true }
hofund-kit-agent = { workspace = true }
hofund-kit-upstream = { workspace = true }
hofund-plugin-registry = { path = ".", features = ["test-fixtures"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = { workspace = true }
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread"] }
toml = "0.8.2"
wiremock = "0.6.5"

[lints]
workspace = true
