id = "fixture-yaml-agent"
display_name = "Fixture YAML Agent"
binary = "fixture-yaml"

[[file]]
id = "config"
kind = "yaml"
linux = "~/.config/fixture-yaml/config.yaml"
macos = "~/Library/Application Support/fixture-yaml/config.yaml"
windows = "~/AppData/Roaming/fixture-yaml/config.yaml"
env_override = "FIXTURE_YAML_HOME"

[[set]]
file = "config"
key = "model.provider"
slot = { literal = "hofund" }

[[set]]
file = "config"
key = "providers.hofund.base_url"
slot = "v1"

[[set]]
file = "config"
key = "providers.hofund.api_key"
slot = "token"

[[set]]
file = "config"
key = "model.default"
slot = { model_if_unset = {} }

[[set]]
file = "config"
key = "providers.hofund.models"
slot = { model_array = { fields = [ { key = "id", value = "id" }, { key = "name", literal = "Hofund" }, { key = "reasoning", json = "true" } ] } }

[[set]]
file = "config"
key = "features.stream"
slot = { json = "false" }

[[set]]
file = "config"
key = "groups"
slot = { append = { each = "once", owner = [ { key = "name", equals = "hofund" } ], fields = [ { key = "name", literal = "hofund" }, { key = "url", value = "v1" }, { key = "models", models = [ { key = "id", prefixed = "hofund/" }, { key = "key", value = "token" } ] } ] } }

[model]
file = "config"
key = "model.default"
